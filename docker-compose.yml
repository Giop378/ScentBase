services:
  mongodb:
    image: mongo:7
    container_name: scentbase-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-scentbase_admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-change_me}"
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-scentbase}"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: